[project]
name = "leadbeast"
version = "0.1.0"
description = "LeadBeast — single-operator, self-hosted lead-ops platform"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary,pool]>=3.2",
  "procrastinate>=3.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "httpx>=0.28",
  "typer>=0.15",
  "structlog>=24.4",
  "weasyprint>=63",
  "uuid-utils>=0.9",
  "python-dotenv>=1.0",
  "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.112",
  "mypy>=1.13",
  "ruff>=0.7",
  "types-requests",
]

[project.scripts]
lb = "leadbeast.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadbeast"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "C90", "SIM", "PL", "RUF"]
ignore = ["E501", "PLR0913"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/leadbeast"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["procrastinate.*", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
